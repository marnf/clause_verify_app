name: clause_verify

description: "Clause Verify."

publish_to: 'none'

version: 1.2.0+18

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ─────────────────────────────────────────────────────────────────────────
  # State Management & Core Utilities
  # ─────────────────────────────────────────────────────────────────────────

  get: ^4.7.3
  gap: ^3.0.1
  http: ^1.6.0
  intl: ^0.20.0
  logger: ^2.6.2
  url_launcher: ^6.2.5
  google_fonts: ^6.3.3
  shared_preferences: ^2.5.4
  flutter_screenutil:

  # ─────────────────────────────────────────────────────────────────────────
  # UI Components & Icons
  # ─────────────────────────────────────────────────────────────────────────

  cupertino_icons: ^1.0.8
  dotted_border: ^2.0.0
  flutter_svg: ^2.2.3
  pinput: ^6.0.1
  dotted_line: ^3.2.3
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.5
  flutter_rating_bar: ^4.0.1
  shimmer:

  # ─────────────────────────────────────────────────────────────────────────
  # Media & File Handling
  # ─────────────────────────────────────────────────────────────────────────

  image_picker: ^1.2.1
  cached_network_image: ^3.4.1
  file_picker: ^10.3.8
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^12.0.1
  path_provider: ^2.1.4
  mime: ^2.0.0

  # ─────────────────────────────────────────────────────────────────────────
  # Firebase & Authentication (Google & Apple Sign-In)
  # ─────────────────────────────────────────────────────────────────────────

  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^6.1.0
  sign_in_with_apple: ^8.0.0
  crypto: ^3.0.3

  # ─────────────────────────────────────────────────────────────────────────
  # Device, Network & Location
  # ─────────────────────────────────────────────────────────────────────────

  device_info_plus: ^12.3.0
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  country_picker: ^2.0.27

  # ─────────────────────────────────────────────────────────────────────────
  # Webview & PDF Viewing
  # ─────────────────────────────────────────────────────────────────────────

  webview_flutter: ^4.4.2
  flutter_pdfview: ^1.3.2

  # ─────────────────────────────────────────────────────────────────────────
  # Date & Time
  # ─────────────────────────────────────────────────────────────────────────

  month_picker_dialog: ^6.7.0

  # ─────────────────────────────────────────────────────────────────────────
  # In-App Purchases (RevenueCat)
  # ─────────────────────────────────────────────────────────────────────────

  purchases_flutter: ^8.0.0

  # ─────────────────────────────────────────────────────────────────────────
  # App Configuration & Build Tools
  # ─────────────────────────────────────────────────────────────────────────

  change_app_package_name: ^1.5.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0



# ─────────────────────────────────────────────────────────────────────────
# App Icons & Splash Screen Configuration
# ─────────────────────────────────────────────────────────────────────────


flutter_native_splash:
  color: "#ffffff"
  image: assets/splash.png


flutter:
  uses-material-design: true

  assets:
    - assets/language/
    - assets/images/
    - assets/icons/
    - assets/icons/splash/
    - assets/logos/
    - assets/images/bg1.png
    - assets/images/bg2.png
    - assets/images/bg3.png
    - assets/images/bg4.png


